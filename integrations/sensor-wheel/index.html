<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sensor wheel</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #000; }
  #stage { position: relative; width: 100%; height: 100%; }
  #band { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
          box-sizing: border-box; z-index: 0; }
  .step { position: absolute; left: 50%; top: 50%; z-index: 1;
          font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
          line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
  <div id="stage">
    <div id="band"></div>
  </div>

<script>
// krakencontrol calls kcUpdate() every frame. The current reading sits in the band,
// with the values it would pass through above and below it, shrinking as they go.
const stage = document.getElementById("stage");
const band = document.getElementById("band");
const ctx = document.createElement("canvas").getContext("2d");
const PROBE = 100;

// Colour, or a picture - picked from images/, typed as a URL, or one of the bundled
// ones - with an optional veil over it so the reading stays readable. The colour stays
// underneath as the fallback.
function paintBackground(settings) {
  const colour = settings.background_color || "#000000";
  const mode = settings.background_mode || "color";
  const image = mode === "image_pick" ? (settings.background_image || "")
              : mode === "image_url" ? (settings.background_url || "")
              : mode === "image_bundled" ? (settings.background_bundled || "")
              : "";
  if (!image) {
    document.body.style.background = colour;
    return;
  }
  const fit = settings.background_fit === "contain" ? "contain"
            : settings.background_fit === "stretch" ? "100% 100%" : "cover";
  const dim = Math.min(90, Math.max(0, Number(settings.background_dim) || 0)) / 100;
  const veil = `linear-gradient(rgba(0,0,0,${dim}), rgba(0,0,0,${dim}))`;
  document.body.style.background =
    `${veil}, url("${image}") center / ${fit} no-repeat, ${colour}`;
}

// Families beyond the installed ones come from Google Fonts, pulled in on demand. The
// daemon waits for the face to arrive before it takes the frame.
const requested = new Set();
function useFont(family) {
  if (!family || requested.has(family)) return;
  requested.add(family);
  const link = document.createElement("link");
  link.rel = "stylesheet";
  // The older css endpoint quietly drops weights a family does not have, where css2
  // rejects the whole request.
  link.href = "https://fonts.googleapis.com/css?family=" +
    encodeURIComponent(family) + ":400,700,900&display=swap";
  document.head.appendChild(link);
}

function format(value, settings, withUnit) {
  if (value === null || value === undefined) return "--";
  const number = Number(value).toFixed(Number(settings.decimals) || 0);
  if (!withUnit || settings.unit === "none") return number;
  return settings.unit === "degc" ? number + "°C" : number + "°";
}

function metrics(text, family, weight, size) {
  ctx.font = weight + " " + size + "px " + family;
  const m = ctx.measureText(text);
  return {
    width: m.width || 1,
    inkAscent: m.actualBoundingBoxAscent,
    inkDescent: m.actualBoundingBoxDescent,
    fontAscent: m.fontBoundingBoxAscent,
    fontDescent: m.fontBoundingBoxDescent,
  };
}

// Canvas reports the ink box as well as the font box; centring on the line box alone
// leaves digits sitting high.
function inkOffset(text, family, weight, size) {
  const m = metrics(text, family, weight, size);
  const baseline = (size - (m.fontAscent + m.fontDescent)) / 2 + m.fontAscent;
  return size / 2 - (baseline - (m.inkAscent - m.inkDescent) / 2);
}

function mix(low, high, t) {
  const parse = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const [ar, ag, ab] = parse(low);
  const [br, bg, bb] = parse(high);
  const k = Math.max(0, Math.min(1, t));
  const channel = (a, b) => Math.round(a + (b - a) * k);
  return `rgb(${channel(ar, br)},${channel(ag, bg)},${channel(ab, bb)})`;
}

function render(payload) {
  const settings = payload.settings || {};
  const sensor = (payload.sensors || {}).sensor || {};
  const stageBox = payload.device || { width: 320, height: 320 };

  useFont(settings.font || "Roboto");
  const family = '"' + (settings.font || "Roboto") + '", sans-serif';
  const weight = settings.weight || "900";
  const gradient = settings.text_mode === "gradient";
  const lowColour = settings.text_color_low || "#2ecc71";
  const highColour = settings.text_color_high || "#e74c3c";
  const lowAt = Number(settings.value_low);
  const highAt = Number(settings.value_high);
  const colour = settings.text_color || "#ffffff";
  // In gradient mode the reading itself picks the colour: at or below the low value it
  // is the low colour, at or above the high value the high one, blended in between.
  const colourFor = (value) => {
    if (!gradient || value === null || value === undefined) return colour;
    const span = highAt - lowAt;
    if (!isFinite(span) || span === 0) return highColour;
    return mix(lowColour, highColour, (value - lowAt) / span);
  };
  const steps = Math.max(1, Math.min(4, Number(settings.steps) || 2));
  const step = Number(settings.step_size) || 1;
  const taper = Math.min(0.95, Math.max(0.3, (Number(settings.taper) || 62) / 100));
  const fade = Math.min(1, Math.max(0.1, (Number(settings.fade) || 55) / 100));
  const spacing = Math.max(0, Number(settings.spacing) || 0);
  const rising = settings.order !== "down";

  paintBackground(settings);

  const display = sensor.value === undefined ? null : sensor.value;

  // Sizes and offsets all scale with the base size, so the fit is arithmetic rather
  // than a measure-and-shrink loop: gaps shrink by the same taper as the type.
  const reach = (1 - Math.pow(taper, steps)) / (1 - taper);
  const wLimit = stageBox.width * 0.86;
  const hLimit = stageBox.height * 0.94;
  const centreText = format(display, settings, true);
  const widthAt100 = metrics(centreText, family, weight, PROBE).width;

  let size;
  if (Number(settings.font_size) > 0) {
    size = Number(settings.font_size);
  } else {
    const byWidth = PROBE * wLimit / widthAt100;
    const byHeight = (hLimit / 2 - spacing * reach) /
                     (reach + Math.pow(taper, steps) / 2);
    size = Math.max(10, Math.floor(Math.min(byWidth, byHeight)));
  }
  // Rows sit close: the first gap is a bit under the type size, and each gap out from
  // the middle shrinks by the same taper as the type. Spacing opens it back up.
  const pitch = size * 0.92 + spacing;

  // Distance from the centre, in steps, decides size, dimming and offset - all of them
  // continuous, so a value part way between two steps looks right.
  function offsetFor(distance) {
    const magnitude = pitch * (1 - Math.pow(taper, Math.abs(distance))) / (1 - taper);
    return distance < 0 ? -magnitude : magnitude;
  }

  stage.querySelectorAll(".step").forEach((el) => el.remove());

  if (display === null) {
    const el = document.createElement("div");
    el.className = "step";
    el.textContent = "--";
    el.style.cssText = `font-family:${family};font-weight:${weight};font-size:${size}px;` +
      `color:${colour};transform:translate(-50%,-50%)`;
    stage.appendChild(el);
  } else {
    const centre = Math.round(display / step) * step;
    for (let i = -steps; i <= steps; i++) {
      const value = centre + i * step;
      const distance = (value - display) / step;
      if (Math.abs(distance) > steps + 0.5) continue;
      const rowSize = Math.max(6, size * Math.pow(taper, Math.abs(distance)));
      const text = format(value, settings, Math.abs(distance) < 0.5);
      const y = offsetFor(rising ? -distance : distance);
      const el = document.createElement("div");
      el.className = "step";
      el.textContent = text;
      el.style.cssText =
        `font-family:${family};font-weight:${weight};font-size:${rowSize.toFixed(1)}px;` +
        `color:${colourFor(value)};` +
        `opacity:${Math.pow(fade, Math.abs(distance)).toFixed(3)};` +
        `transform:translate(-50%,-50%) translateY(${(y + inkOffset(text, family, weight, rowSize)).toFixed(1)}px)`;
      stage.appendChild(el);
    }
  }

  const bandOn = settings.band !== false && settings.band !== "false";
  band.style.display = bandOn ? "block" : "none";
  if (bandOn) {
    const line = Math.max(0, Number(settings.band_line_thickness) ?? 2);
    const width = Math.round(stageBox.width *
      Math.min(100, Math.max(20, Number(settings.band_width) || 80)) / 100);
    band.style.width = width + "px";
    band.style.height = Math.round(size * 1.34) + "px";
    band.style.background = settings.band_color || "#151a21";
    band.style.borderRadius = (Number(settings.band_radius) ?? 8) + "px";
    band.style.borderTop = band.style.borderBottom =
      line > 0 ? `${line}px solid ${settings.band_line_color || "#3f4b5b"}` : "0";
  }
  return true;
}

window.kcUpdate = (payload) => render(payload);
</script>
</body>
</html>
